services:
  - type: web
    name: whatsapp-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SESSION_ID
        value: default_session
      - key: PREFIX
        value: .
      - key: OWNER_NUMBER
        value: your_number_here
